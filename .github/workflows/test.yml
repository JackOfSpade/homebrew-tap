name: Test
run-name: Test • ${{ github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          echo "/opt/homebrew/bin:/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install, test, and audit all formulae
        run: |
          # Tap name must match THIS repo (JackOfSpade/homebrew-tap -> jackofspade/tap).
          # It previously read designorant/tap, copied from another project, so every
          # formula resolved under a namespace this repo does not own.
          brew tap jackofspade/tap "$GITHUB_WORKSPACE"
          # Homebrew refuses to load formulae from a non-official tap until it is
          # trusted ("Refusing to load formula ... from untrusted tap"), which is what
          # actually failed this job. The tap here is this very repo's checkout.
          brew trust jackofspade/tap
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            echo "::group::$name"
            # Fully qualify so the tapped copy is used, never a same-named formula
            # from homebrew-core.
            brew install "jackofspade/tap/$name"
            brew test "jackofspade/tap/$name"
            brew audit --strict --online "jackofspade/tap/$name"
            echo "::endgroup::"
          done
